<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlazorKioscoDesktop</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BlazorKioscoDesktop.styles.css" />
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        window.mascaraMoneda = {
            init: function (element, dotNetHelper, methodName) {
                if (!element) return;

                element.addEventListener('input', function (e) {
                    // 1. Limpiar todo lo que no sea número
                    let value = e.target.value.replace(/\D/g, "");

                    if (value === "") value = "0";

                    // 2. Convertir a decimal (los últimos dos números siempre serán los centavos)
                    let decimalValue = (parseInt(value) / 100).toFixed(2);

                    // 3. Formatear con puntos en miles y coma en centavos (es-AR)
                    let formatted = new Intl.NumberFormat('es-AR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(decimalValue);

                    e.target.value = formatted;

                    // 4. Avisarle a Blazor en tiempo real el nuevo valor formateado
                    dotNetHelper.invokeMethodAsync(methodName, formatted);
                });
            }
        };
    </script>

</body>

</html>
