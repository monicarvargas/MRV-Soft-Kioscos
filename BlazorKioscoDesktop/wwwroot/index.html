<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MRV Soft</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BlazorKioscoDesktop.styles.css" />
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Lector de códigos con la cámara: versión fija (la dirección sin versión dejó de andar y no abría la cámara) -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        // ===== Lector de códigos de barras con la cámara =====
        // iniciarEscaneo(ref, metodo)       : muestra la cámara dentro del recuadro id="reader" de la página.
        // escanearEnVentana(ref, metodo)    : abre una ventana encima de todo con la cámara y un botón Cerrar (BotonCamara).
        // detenerEscaneo / cerrarVentanaEscaneo : apagan la cámara.
        // El lector de mano (USB) no usa nada de esto: escribe el código en el campo y manda Enter.
        window.methodsJS = (function () {
            const LIB = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";

            function aviso(caja, msg) {
                if (caja) caja.innerHTML = '<div style="padding:.8rem;border:1px solid #f2d48a;border-radius:12px;background:#fff8e1;color:#7a5200;font-weight:700;text-align:center">' + msg + '</div>';
            }

            async function cargarLibreria() {
                if (typeof Html5Qrcode !== "undefined") return true;
                // si no cargó (internet lento), se intenta de nuevo
                await new Promise((ok) => {
                    const s = document.createElement("script");
                    s.src = LIB; s.onload = ok; s.onerror = ok;
                    document.head.appendChild(s);
                });
                return typeof Html5Qrcode !== "undefined";
            }

            async function pararLector() {
                const l = window.__lectorMRV;
                window.__lectorMRV = null;
                if (!l) return;
                try { await l.stop(); } catch (e) { }
                try { l.clear(); } catch (e) { }
            }

            function quitarVentana() {
                const v = document.getElementById("mrvLectorVentana");
                if (v) v.remove();
            }

            async function detener() { await pararLector(); quitarVentana(); }

            function textoError(err) {
                const t = String((err && (err.name || err.message)) ? (err.name + " " + err.message) : (err || ""));
                if (/Permission|NotAllowed/i.test(t))
                    return "La app no tiene permiso para usar la cámara. Dáselo en los ajustes del celular (Apps → Chrome / MRV Soft → Permisos → Cámara) y probá de nuevo.";
                if (/NotFound|Requested device|OverconstrainedError/i.test(t))
                    return "No se encontró la cámara en este equipo. Usá el lector de códigos o escribí el código.";
                if (/NotReadable|in use|Could not start/i.test(t))
                    return "La cámara está siendo usada por otra app. Cerrala y probá de nuevo.";
                if (/secure|https/i.test(t))
                    return "La cámara solo anda entrando por https (la dirección de la app).";
                return "No se pudo abrir la cámara: " + t;
            }

            // arranca la cámara dentro del elemento idCaja; alLeer(texto) se llama una sola vez
            async function arrancar(idCaja, alLeer) {
                const caja = document.getElementById(idCaja);
                if (!caja) return;
                if (!(await cargarLibreria())) { aviso(caja, "No se pudo cargar el lector de la cámara. Revisá la conexión a internet y probá de nuevo."); return; }

                await pararLector();
                caja.innerHTML = "";

                const F = window.Html5QrcodeSupportedFormats || {};
                const formatos = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE].filter(x => x !== undefined);
                let lector;
                try { lector = new Html5Qrcode(idCaja, formatos.length ? { formatsToSupport: formatos, verbose: false } : undefined); }
                catch (e) { aviso(caja, textoError(e)); return; }
                window.__lectorMRV = lector;

                let leido = false;
                try {
                    await lector.start(
                        { facingMode: "environment" }, // cámara de atrás
                        { fps: 10, qrbox: { width: 260, height: 140 } },
                        (texto) => {
                            if (leido) return;
                            leido = true;
                            try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) { }
                            // apaga la cámara y le manda el código a C#
                            detener().finally(() => alLeer(texto));
                        }
                    );
                    // si mientras arrancaba la cerraron (o se abrió otra), se apaga
                    if (window.__lectorMRV !== lector) { try { await lector.stop(); } catch (e) { } try { lector.clear(); } catch (e) { } }
                } catch (err) {
                    console.warn("Lector de códigos:", err);
                    if (window.__lectorMRV === lector) window.__lectorMRV = null;
                    aviso(document.getElementById(idCaja), textoError(err));
                }
            }

            return {
                iniciarEscaneo: async function (dotNetHelper, metodo) {
                    quitarVentana();
                    await arrancar("reader", (t) => dotNetHelper.invokeMethodAsync(metodo || 'ProcesarCodigoEscaneado', t));
                },

                escanearEnVentana: async function (dotNetHelper, metodo) {
                    await detener();
                    const v = document.createElement("div");
                    v.id = "mrvLectorVentana";
                    v.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px";
                    v.innerHTML =
                        '<div style="color:#fff;font-weight:800;font-size:1.05rem;text-align:center">Apuntá la cámara al código de barras</div>' +
                        '<div id="mrvLectorVideo" style="width:100%;max-width:440px;min-height:120px;background:#000;border-radius:14px;overflow:hidden"></div>' +
                        '<button type="button" id="mrvLectorCerrar" style="min-width:180px;height:48px;border:0;border-radius:12px;background:#fff;color:#1f2a44;font-weight:800;font-size:1rem">✕ Cerrar</button>';
                    document.body.appendChild(v);
                    v.querySelector("#mrvLectorCerrar").addEventListener("click", () => detener());
                    v.addEventListener("click", (e) => { if (e.target === v) detener(); });
                    await arrancar("mrvLectorVideo", (t) => dotNetHelper.invokeMethodAsync(metodo || 'CodigoDeCamara', t));
                },

                detenerEscaneo: detener,

                cerrarVentanaEscaneo: async function () {
                    if (document.getElementById("mrvLectorVentana")) await detener();
                }
            };
        })();

        // Escape cierra la ventana de la cámara
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && document.getElementById("mrvLectorVentana")) window.methodsJS.cerrarVentanaEscaneo();
        });
    </script>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // ===== Campos de número: sin ruedita del mouse y flechitas de a 1 =====
        // 1) La ruedita NO cambia el valor: si el campo tiene el foco, se le saca y la página se desplaza normal.
        // 2) Flechitas (las del campo y las del teclado ↑ ↓): suman o restan 1, nunca 0,1 ni 0,01.
        //    Igual se pueden escribir decimales a mano.
        (function () {
            function esNumero(el) { return el && el.tagName === 'INPUT' && el.type === 'number'; }

            document.addEventListener('wheel', function (e) {
                var el = e.target;
                if (esNumero(el) && document.activeElement === el) el.blur();
            }, { capture: true, passive: true });

            // step="any" hace que las flechitas del campo vayan de a 1 y deja escribir decimales sin marcar error
            document.addEventListener('focusin', function (e) {
                if (esNumero(e.target)) e.target.setAttribute('step', 'any');
            }, true);
            document.addEventListener('mouseover', function (e) {
                if (esNumero(e.target) && e.target.getAttribute('step') !== 'any') e.target.setAttribute('step', 'any');
            }, true);

            document.addEventListener('keydown', function (e) {
                var el = e.target;
                if (!esNumero(el) || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') || el.readOnly || el.disabled) return;
                e.preventDefault();
                var v = parseFloat(el.value); if (isNaN(v)) v = 0;
                v += e.key === 'ArrowUp' ? 1 : -1;
                if (el.min !== '' && v < parseFloat(el.min)) v = parseFloat(el.min);
                if (el.max !== '' && v > parseFloat(el.max)) v = parseFloat(el.max);
                el.value = Math.round(v * 1000) / 1000;
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
            }, true);
        })();
    </script>
    <script>
        // ===== Campos de plata (clase "js-monto"): se ve el punto de miles mientras se escribe =====
        // Ej: 3000 → 3.000 · 20000 → 20.000 · 1500,5 → 1.500,5 (la coma es para los centavos).
        (function () {
            function formatear(el) {
                var v = el.value || '';
                var pos = el.selectionStart == null ? v.length : el.selectionStart;
                var antes = v.slice(0, pos).replace(/[^\d,]/g, '').length;      // dígitos y coma antes del cursor
                var limpio = v.replace(/[^\d,]/g, '');
                var i = limpio.indexOf(',');
                var ent = i < 0 ? limpio : limpio.slice(0, i);
                var dec = i < 0 ? null : limpio.slice(i + 1).replace(/,/g, '').slice(0, 2);
                ent = ent.replace(/^0+(?=\d)/, '');
                var nuevo = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (dec !== null ? ',' + dec : '');
                if (nuevo === v) return;
                el.value = nuevo;
                var n = 0, p = 0;
                while (p < nuevo.length && n < antes) { if (/[\d,]/.test(nuevo[p])) n++; p++; }
                try { el.setSelectionRange(p, p); } catch (e) { }
            }
            document.addEventListener('input', function (e) {
                var el = e.target;
                if (el && el.classList && el.classList.contains('js-monto')) formatear(el);
            }, true);
        })();
    </script>
    <script>
        // Todo lo que se escribe queda en MAYÚSCULAS (más prolijo), como el nombre del producto.
        // No se toca: contraseñas, mails, números, fechas, ni los campos con data-no-mayus
        // (o que estén adentro de algo con la clase "no-mayus").
        (function () {
            function aplica(el) {
                if (!el || el.readOnly || el.disabled) return false;
                if (el.tagName === 'INPUT') {
                    var t = (el.getAttribute('type') || 'text').toLowerCase();
                    if (t !== 'text' && t !== 'search') return false;
                } else if (el.tagName !== 'TEXTAREA') return false;
                if (el.closest('[data-no-mayus], .no-mayus')) return false;
                var ac = (el.getAttribute('autocomplete') || '').toLowerCase();
                if (ac.indexOf('password') >= 0 || ac.indexOf('email') >= 0) return false;
                if ((el.id || '').toLowerCase().indexOf('pass') >= 0) return false;
                if ((el.getAttribute('inputmode') || '').toLowerCase() === 'email') return false;
                return true;
            }
            // se engancha ANTES que Blazor (fase de captura), así Blazor ya recibe el texto en mayúsculas
            document.addEventListener('input', function (e) {
                var el = e.target;
                if (e.isComposing || !aplica(el)) return;
                var v = el.value, m = v.toUpperCase();
                if (v === m || m.length !== v.length) return;
                var a = el.selectionStart, b = el.selectionEnd;
                el.value = m;
                try { el.setSelectionRange(a, b); } catch (_) { }
            }, true);
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        window.mascaraMoneda = {
            init: function (element, dotNetHelper, methodName) {
                if (!element) return;

                element.addEventListener('input', function (e) {
                    // 1. Limpiar todo lo que no sea número
                    let value = e.target.value.replace(/\D/g, "");

                    if (value === "") value = "0";

                    // 2. Convertir a decimal (los últimos dos números siempre serán los centavos)
                    let decimalValue = (parseInt(value) / 100).toFixed(2);

                    // 3. Formatear con puntos en miles y coma en centavos (es-AR)
                    let formatted = new Intl.NumberFormat('es-AR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }).format(decimalValue);

                    e.target.value = formatted;

                    // 4. Avisarle a Blazor en tiempo real el nuevo valor formateado
                    dotNetHelper.invokeMethodAsync(methodName, formatted);
                });
            }
        };
    </script>
